[[piglit]]
piglit_folder = "/piglit"
profile = "gpu"
process_isolation = true
fraction = 6
  [piglit.env]
  PIGLIT_NO_WINDOW = "1"

[[piglit]]
piglit_folder = "/piglit"
profile = "cl"
process_isolation = true
  [piglit.env]
  RUSTICL_ENABLE = "msm"

# force-gmem testing of GL_EXT_YUV_target sampling/rendering
[[piglit]]
piglit_folder = "/piglit"
profile = "gpu"
process_isolation = true
include = ["spec@ext_yuv_target@.*"]
prefix = "gmem-"
  [piglit.env]
  PIGLIT_NO_WINDOW = "1"
  FD_MESA_DEBUG = "gmem"

# force-sysmem (bypass) testing of GL_EXT_YUV_target sampling/rendering
[[piglit]]
piglit_folder = "/piglit"
profile = "gpu"
process_isolation = true
include = ["spec@ext_yuv_target@.*"]
prefix = "bypass-"
  [piglit.env]
  PIGLIT_NO_WINDOW = "1"
  FD_MESA_DEBUG = "sysmem"
