# Builds the Mac release (tools/macos/package.sh) on a GitHub-hosted Apple Silicon runner.
# A release (the latest release on GitHub, with dist/bbport-mac-<version>.zip, its checksum and the notes in
# docs/release/<version>.md, else docs/release/NEXT.md) is published by any of:
# - "Run workflow" in the Actions tab, with a version such as 0.4-v2 (on the branch chosen);
# - pushing a tag such as 0.4-v2;
# - pushing a branch release/0.4-v2.
# Versions: <upstream bbport version>-v<our build for it>, e.g. 0.4-v1, 0.4-v2, 0.4.1-v1, 0.5-v1.
# A test release before it ends in -pre<n> (0.6-v1-pre1): published as a GitHub pre-release, so
# the latest release stays the one most people should download.
# A push to a ci-* branch, or "Run workflow" without a version, only builds the zip (kept as a
# workflow artifact), to try a build without releasing it; such test builds reuse what an earlier
# test build of the same branch compiled (ccache), releases never do. The ci-* branch is deleted again
# once its build has finished or was cancelled (the run keeps the result, annotations and zip).
# Caches are only shared with runs of the same ref (and the default branch): use one ci-* name per
# line of work (ci-native07, ci-metal-2), not a new name per build, or every test build compiles
# the dependencies and the port from scratch.
name: Mac release

on:
  push:
    tags: ['*-v*']
    branches: ['ci-*', 'release/*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.4-v2, or 0.6-v1-pre1 for a pre-release (empty: a test build, nothing published)'
        required: false
        default: ''

# Read-only by default. The build runs third-party build scripts (dependencies' configure and
# make files, Homebrew, pip), so it never holds a token that can write to the repository; only
# the publish job, which runs nothing but GitHub's own CLI, gets write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 240
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false # no token left in .git/config for the build's scripts

      - name: Rosetta 2
        run: |
          /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null ||
            sudo softwareupdate --install-rosetta --agree-to-license
          /usr/bin/arch -x86_64 /usr/bin/true

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          publish=1
          if [[ -n $INPUT_VERSION ]]; then
            version=$INPUT_VERSION
          elif [[ $GITHUB_REF == refs/tags/* ]]; then
            version=${GITHUB_REF#refs/tags/}
          elif [[ $GITHUB_REF == refs/heads/release/* ]]; then
            version=${GITHUB_REF#refs/heads/release/}
          else
            version=$(git describe --tags --always)-ci
            publish=0
          fi
          # A release is <upstream version>-v<build> (0.5-v1, 0.5.1-v2), a pre-release that and
          # -pre<n> (0.6-v1-pre1); a test build's describe output only needs to start with a
          # letter or digit (never an option for gh or git).
          if (( publish )); then
            [[ $version =~ ^[0-9]+(\.[0-9]+)*-v[0-9]+(-pre[0-9]+)?$ ]] || { echo "::error::version '$version': expected <upstream>-v<n>, e.g. 0.5-v1, or 0.6-v1-pre1"; exit 1; }
          else
            [[ $version =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::version '$version': letters, digits, dot, dash or underscore only"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version: $version (publish: $publish)"
          sw_vers; uname -m; sysctl -n hw.ncpu machdep.cpu.brand_string

      # The x86-64 libraries and KosmicKrisp take most of the build; they are kept between runs
      # until their recipe changes (their sources are not kept).
      - name: Restore dependencies
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            deps-x86_64
            !deps-x86_64/src
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/macos/setup_deps.sh', 'tools/macos/kosmickrisp-patches/**') }}

      - name: Dependencies
        run: bash tools/macos/setup_deps.sh

      - name: Save dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps-x86_64
            !deps-x86_64/src
          key: ${{ steps.deps.outputs.cache-primary-key }}

      # The native GPU process branches (docs/macos-native-gpu.md): the same libraries for arm64,
      # kept the same way, and bb-gpu built against them (packaged with them: tools/macos/package.sh).
      - name: Restore arm64 dependencies
        id: deps_arm64
        if: hashFiles('tools/macos/build_gpu_native.sh') != ''
        uses: actions/cache/restore@v4
        with:
          path: |
            deps-arm64
            !deps-arm64/src
          key: deps-arm64-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/macos/setup_deps.sh', 'tools/macos/kosmickrisp-patches/**') }}

      - name: Dependencies (arm64)
        if: hashFiles('tools/macos/build_gpu_native.sh') != ''
        run: BB_ARCH=arm64 bash tools/macos/setup_deps.sh

      - name: Save arm64 dependencies
        if: hashFiles('tools/macos/build_gpu_native.sh') != '' && steps.deps_arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps-arm64
            !deps-arm64/src
          key: ${{ steps.deps_arm64.outputs.cache-primary-key }}

      # ccache for test builds only (ci-*, "Run workflow" without a version): files compiled by an
      # earlier test build of the same branch name come from the cache. A release (publish=1)
      # builds everything from scratch without it, so nothing a test branch compiled can reach a
      # release (docs/security-review.md, known gaps). Only an explicit test build (publish=0) uses
      # it: a missing value builds as a release does. Kept at most 1 GB per run; GitHub evicts the
      # least recently used caches, the dependencies above being used by every run.
      - name: Restore the compiler cache (test builds)
        if: steps.version.outputs.publish == '0'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-

      - name: Build
        env:
          BB_CCACHE: ${{ steps.version.outputs.publish == '0' && '1' || '0' }}
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 1G
        run: bash tools/macos/build.sh

      # build.sh only warns when bb-gpu does not build (the game runs without it); here it fails.
      - name: Native GPU process (arm64)
        if: hashFiles('tools/macos/build_gpu_native.sh') != ''
        env:
          BB_CCACHE: ${{ steps.version.outputs.publish == '0' && '1' || '0' }}
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 1G
        run: bash tools/macos/build_gpu_native.sh

      - name: Compiler cache statistics (test builds)
        if: steps.version.outputs.publish == '0'
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: command -v ccache >/dev/null && ccache --show-stats || true

      - name: Store the compiler cache (test builds)
        if: steps.version.outputs.publish == '0'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Package
        run: |
          set -o pipefail
          bash tools/macos/package.sh "${{ steps.version.outputs.version }}" 2>&1 | tee out/package.log

      # The package report as annotations (readable through the checks API, unlike the logs).
      - name: Report
        if: always()
        run: |
          report=out/package/report.txt
          [[ -f $report ]] || exit 0
          encode() { python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")'; }
          echo "::notice title=Smoke test::$(sed -n '1,/^Files:/p' "$report" | encode)"
          echo "::notice title=App contents::$(sed -n '/^Files:/,$p' "$report" | head -150 | encode)"

      - name: Logs on failure
        if: failure()
        run: |
          # Up to 8 annotations of 80 lines per log: the errors stay readable from the API
          # (check-run annotations) when the full log isn't.
          for log in out/gpu-errors.txt out/loader-build.log out/gpu-arm64-errors.txt \
                     out/gpu-arm64-configure.log deps-x86_64/setup.log deps-arm64/setup.log out/package.log; do
            [[ -f $log ]] || continue
            # The dependencies' logs: their last lines (a failed clone says "fatal:", not "error").
            { [[ $log == *errors.txt ]] && cat "$log" ||
              { [[ $log == */package.log || $log == */setup.log ]] && tail -80 "$log" || grep -E 'error' "$log"; }; } | head -640 |
              split -l 80 - "/tmp/annotation-$(basename "$log")-"
            for part in /tmp/annotation-"$(basename "$log")"-*; do
              [[ -f $part ]] && echo "::error title=$log $(basename "$part")::$(python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")' < "$part")"
            done
          done
          # Third-party build output is printed with workflow commands off: a line in it can't act
          # as one.
          token=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
          echo "::stop-commands::$token"
          for log in out/gpu-errors.txt out/loader-build.log out/gpu-arm64-errors.txt \
                     out/gpu-arm64-configure.log deps-x86_64/setup.log deps-arm64/setup.log; do
            [[ -f $log ]] && { echo "=== $log"; tail -150 "$log"; }
          done
          for deps in deps-x86_64 deps-arm64; do
            ls "$deps/logs" 2>/dev/null | while read -r log; do
              echo "=== $deps/logs/$log"; tail -40 "$deps/logs/$log"
            done
          done
          echo "::$token::"
          true

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: bbport-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  # Publishing: the only job with write access. It runs no build code: the notes from the
  # repository, the zip from the build job's artifact, and GitHub's CLI. Creates the tag at the
  # commit built when it doesn't exist yet.
  publish:
    needs: build
    if: needs.build.outputs.publish == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the release notes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: docs/release

      - name: Download the zip
        uses: actions/download-artifact@v4
        with:
          name: bbport-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.version }}
        run: |
          [[ $TAG =~ ^[0-9]+(\.[0-9]+)*-v[0-9]+(-pre[0-9]+)?$ ]] || { echo "::error::version '$TAG'"; exit 1; }
          notes=docs/release/$TAG.md
          [[ -f $notes ]] || notes=docs/release/NEXT.md
          (cd dist && shasum -a 256 -c ./*.zip.sha256)
          # A pre-release (-pre<n>) leaves the latest release as it is.
          kind=--latest
          [[ $TAG == *-pre* ]] && kind=--prerelease
          gh release create "$TAG" dist/*.zip dist/*.zip.sha256 \
            --target "$GITHUB_SHA" --title "bbport-mac-$TAG" --notes-file "$notes" "$kind"

  # Test builds: the ci-* branch was only pushed to start this run; it goes once the build has
  # finished, pass or fail, or was cancelled. Like publish, it runs no build code:
  # write access for one call deleting a branch named ci-*. A branch already gone (a later push
  # to the same name, whose run deleted it) is not an error.
  cleanup:
    needs: build
    if: ${{ always() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the test branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          [[ $BRANCH =~ ^ci-[A-Za-z0-9._-]+$ ]] || { echo "::error::not a test branch: '$BRANCH'"; exit 1; }
          if out=$(gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH" 2>&1); then
            echo "Deleted test branch $BRANCH"
          elif [[ $out == *"Reference does not exist"* || $out == *"HTTP 422"* || $out == *"HTTP 404"* ]]; then
            echo "Branch $BRANCH was already gone"
          else
            echo "::error::could not delete $BRANCH: $out"; exit 1
          fi
