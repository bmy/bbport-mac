# Builds the Mac release (tools/macos/package.sh) on a GitHub-hosted Apple Silicon runner.
# A release (the latest release on GitHub, with dist/bbport-mac-<version>.zip, its checksum and the notes in
# docs/release/<version>.md, else docs/release/NEXT.md) is published by any of:
# - "Run workflow" in the Actions tab, with a version such as 0.4-v2 (on the branch chosen);
# - pushing a tag such as 0.4-v2;
# - pushing a branch release/0.4-v2.
# Versions: <upstream bbport version>-v<our build for it>, e.g. 0.4-v1, 0.4-v2, 0.4.1-v1, 0.5-v1.
# A push to a ci-* branch, or "Run workflow" without a version, only builds the zip (kept as a
# workflow artifact), to try a build without releasing it.
name: Mac release

on:
  push:
    tags: ['*-v*']
    branches: ['ci-*', 'release/*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.4-v2 (empty: a test build, nothing published)'
        required: false
        default: ''

# Read-only by default. The build runs third-party build scripts (dependencies' configure and
# make files, Homebrew, pip), so it never holds a token that can write to the repository; only
# the publish job, which runs nothing but GitHub's own CLI, gets write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 240
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false # no token left in .git/config for the build's scripts

      - name: Rosetta 2
        run: |
          /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null ||
            sudo softwareupdate --install-rosetta --agree-to-license
          /usr/bin/arch -x86_64 /usr/bin/true

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          publish=1
          if [[ -n $INPUT_VERSION ]]; then
            version=$INPUT_VERSION
          elif [[ $GITHUB_REF == refs/tags/* ]]; then
            version=${GITHUB_REF#refs/tags/}
          elif [[ $GITHUB_REF == refs/heads/release/* ]]; then
            version=${GITHUB_REF#refs/heads/release/}
          else
            version=$(git describe --tags --always)-ci
            publish=0
          fi
          # A release is <upstream version>-v<build> (0.5-v1, 0.5.1-v2); a test build's describe
          # output only needs to start with a letter or digit (never an option for gh or git).
          if (( publish )); then
            [[ $version =~ ^[0-9]+(\.[0-9]+)*-v[0-9]+$ ]] || { echo "::error::version '$version': expected <upstream>-v<n>, e.g. 0.5-v1"; exit 1; }
          else
            [[ $version =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::version '$version': letters, digits, dot, dash or underscore only"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version: $version (publish: $publish)"
          sw_vers; uname -m; sysctl -n hw.ncpu machdep.cpu.brand_string

      # The x86-64 libraries and KosmicKrisp take most of the build; they are kept between runs
      # until their recipe changes (their sources are not kept).
      - name: Restore dependencies
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            deps-x86_64
            !deps-x86_64/src
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/macos/setup_deps.sh', 'tools/macos/kosmickrisp-patches/**') }}

      - name: Dependencies
        run: bash tools/macos/setup_deps.sh

      - name: Save dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps-x86_64
            !deps-x86_64/src
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Build
        run: bash tools/macos/build.sh

      - name: Package
        run: bash tools/macos/package.sh "${{ steps.version.outputs.version }}"

      # The package report as annotations (readable through the checks API, unlike the logs).
      - name: Report
        if: always()
        run: |
          report=out/package/report.txt
          [[ -f $report ]] || exit 0
          encode() { python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"), end="")'; }
          echo "::notice title=Smoke test::$(sed -n '1,/^Files:/p' "$report" | encode)"
          echo "::notice title=App contents::$(sed -n '/^Files:/,$p' "$report" | head -150 | encode)"

      - name: Logs on failure
        if: failure()
        run: |
          for log in out/gpu-errors.txt out/loader-build.log; do
            [[ -f $log ]] && echo "::error title=$log::$(tail -60 "$log" | python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\n","%0A"), end="")')"
          done
          for log in out/gpu-errors.txt out/loader-build.log deps-x86_64/setup.log; do
            [[ -f $log ]] && { echo "=== $log"; tail -150 "$log"; }
          done
          ls deps-x86_64/logs 2>/dev/null | while read -r log; do
            echo "=== deps-x86_64/logs/$log"; tail -40 "deps-x86_64/logs/$log"
          done
          true

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: bbport-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  # Publishing: the only job with write access. It runs no build code: the notes from the
  # repository, the zip from the build job's artifact, and GitHub's CLI. Creates the tag at the
  # commit built when it doesn't exist yet.
  publish:
    needs: build
    if: needs.build.outputs.publish == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the release notes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: docs/release

      - name: Download the zip
        uses: actions/download-artifact@v4
        with:
          name: bbport-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.version }}
        run: |
          [[ $TAG =~ ^[0-9]+(\.[0-9]+)*-v[0-9]+$ ]] || { echo "::error::version '$TAG'"; exit 1; }
          notes=docs/release/$TAG.md
          [[ -f $notes ]] || notes=docs/release/NEXT.md
          (cd dist && shasum -a 256 -c ./*.zip.sha256)
          gh release create "$TAG" dist/*.zip dist/*.zip.sha256 \
            --target "$GITHUB_SHA" --title "bbport-mac-$TAG" --notes-file "$notes" --latest
